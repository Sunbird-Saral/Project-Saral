version: '3.7'
services:
  saral-backend:
    image: anuvaadio/${image}:${tag}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    environment:
      PROFILE: dev
      PORT: 3005
      MONGODB_URL: mongodb://10.32.0.194:27017/saralv1newdb
      JWT_SECRET: SARALDATA_NODE
      WHITELIST_DOMAINS: ['http://15.207.30.199','https://test-api.dummy.org', 'http://localhost:3000']
    ports:
    - "3005:3005"

    networks:
      - app

networks:
  app:
    driver: overlay
    external: true
